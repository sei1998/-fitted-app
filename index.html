  .res-acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .res-act{padding:13px 8px;border-radius:12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#c8c0d8;font-size:0.56rem;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all 0.2s;text-align:center;}
  .res-act:hover{background:rgba(255,255,255,0.07);color:#f8f4ff;}
  .back-btn{width:100%;padding:14px;background:transparent;border:1px solid #1e1a2a;border-radius:100px;color:#3a3550;font-size:0.6rem;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:all 0.2s;}
  .back-btn:hover{border-color:#3a3550;color:#8a8098;}

  /* FIND THIS FIT */
  .ftf-up{width:100%;aspect-ratio:4/5;border-radius:18px;border:1px dashed rgba(200,192,216,0.12);background:rgba(5,2,8,0.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;position:relative;overflow:hidden;}
  .ftf-up:hover{border-color:rgba(200,192,216,0.28);}
  .ftf-up img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .ftf-up-ov{position:absolute;inset:0;background:rgba(5,2,8,0.75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:0;transition:opacity 0.2s;}
  .ftf-up:hover .ftf-up-ov{opacity:1;}
  .ftf-res{padding:20px;border-radius:18px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:12px;margin-bottom:10px;}
  .ftf-rt{font-family:'Playfair Display',serif;font-size:1rem;color:#c8c0d8;}
  .ftf-rd{font-size:0.74rem;color:#8a8098;line-height:1.85;}
  .ftf-tags{display:flex;flex-wrap:wrap;gap:8px;}
  .ftf-tag{padding:6px 14px;border-radius:100px;font-size:0.58rem;letter-spacing:2px;text-transform:uppercase;background:rgba(122,21,37,0.1);border:1px solid rgba(158,30,48,0.2);color:#9e1e30;}

  /* REVIEWS */
  .rev-form{padding:22px;border-radius:18px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:14px;}
  .star-row{display:flex;gap:8px;}
  .star-btn{font-size:1.5rem;background:transparent;border:none;cursor:pointer;transition:transform 0.15s;line-height:1;}
  .star-btn:hover{transform:scale(1.2);}
  .rev-ta{width:100%;background:rgba(5,2,8,0.6);border:1px solid #1e1a2a;border-radius:12px;color:#f8f4ff;font-family:'Raleway',sans-serif;font-size:0.75rem;padding:14px 16px;outline:none;resize:none;line-height:1.7;}
  .rev-ta::placeholder{color:#2e2a3a;}
  .rev-ta:focus{border-color:#c8c0d8;}
  .rev-card{padding:20px;border-radius:16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);margin-bottom:10px;}
  .rev-stars{display:flex;gap:3px;margin-bottom:8px;}
  .rev-st{font-size:0.78rem;}
  .rev-st.on{color:#c9a84c;}
  .rev-st.off{color:#1e1a2a;}
  .rev-txt{font-size:0.75rem;color:#8a8098;line-height:1.7;font-style:italic;margin-bottom:10px;}
  .rev-auth{font-size:0.54rem;letter-spacing:3px;text-transform:uppercase;color:#4a4560;}
  .rev-dt{font-size:0.5rem;color:#2a2535;margin-left:8px;}
  .no-rev{text-align:center;padding:32px 0;font-size:0.6rem;letter-spacing:2px;color:#1e1a2a;text-transform:uppercase;line-height:2.5;}

  /* MODAL */
  .modal-bg{position:fixed;inset:0;background:rgba(5,2,8,0.95);backdrop-filter:blur(12px);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
  .modal-box{width:100%;max-width:460px;background:#080510;border:1px solid rgba(255,255,255,0.08);border-radius:24px 24px 0 0;padding:28px 22px 40px;max-height:92vh;overflow-y:auto;}
  .modal-handle{width:34px;height:3px;background:#1e1a2a;border-radius:100px;margin:0 auto 22px;}
  .modal-t{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:400;margin-bottom:6px;}
  .modal-t em{font-style:italic;color:#c8c0d8;}
  .modal-s{font-size:0.62rem;letter-spacing:1.5px;color:#3a3550;line-height:1.9;margin-bottom:20px;}
  .tier{border-radius:16px;padding:18px 20px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);margin-bottom:10px;}
  .tier.feat{border-color:rgba(158,30,48,0.2);background:rgba(122,21,37,0.06);}
  .tier-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .tier-n{font-family:'Raleway',sans-serif;font-weight:600;font-size:0.72rem;letter-spacing:3px;text-transform:uppercase;}
  .tier-p{font-family:'Playfair Display',serif;font-size:1.25rem;color:#c8c0d8;}
  .tier-p small{font-size:0.58rem;color:#3a3550;}
  .tier-d{font-size:0.62rem;color:#4a4560;line-height:1.7;}
  .tier-perks{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:6px;}
  .tier-perks li{font-size:0.62rem;color:#5a5070;display:flex;align-items:center;gap:8px;}
  .tier-perks li::before{content:'✦';color:rgba(200,192,216,0.4);font-size:0.45rem;}
  .pack-btn{width:100%;padding:12px 18px;background:transparent;border:1px solid #1e1a2a;border-radius:12px;color:#4a4560;font-family:'Raleway',sans-serif;font-size:0.68rem;letter-spacing:1px;cursor:pointer;transition:all 0.2s;text-align:left;display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .pack-btn:hover{border-color:#c8c0d8;color:#f8f4ff;}
  .div-txt{text-align:center;font-size:0.52rem;letter-spacing:2px;color:#1e1a2a;text-transform:uppercase;margin:6px 0;}
  .err-txt{font-size:0.62rem;color:#9e1e30;letter-spacing:1px;}

  /* ACCOUNT */
  .acct-avatar{width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid rgba(200,192,216,0.3);margin:0 auto 16px;display:block;}
  .acct-name{text-align:center;font-family:'Playfair Display',serif;font-size:1.2rem;margin-bottom:4px;}
  .acct-email{text-align:center;font-size:0.6rem;letter-spacing:2px;color:#3a3550;text-transform:uppercase;margin-bottom:20px;}
`;

function Stars({count}){
  return <div className="rev-stars">{[1,2,3,4,5].map(i=><span key={i} className={`rev-st ${i<=count?"on":"off"}`}>★</span>)}</div>;
}

function App(){
  const [user, setUser] = useState(null);
  const [profile, setProfile] = useState(null);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("home");
  const [authMode, setAuthMode] = useState("login");
  const [authEmail, setAuthEmail] = useState("");
  const [authPass, setAuthPass] = useState("");
  const [authErr, setAuthErr] = useState("");
  const [authLoading, setAuthLoading] = useState(false);
  const [setupStep, setSetupStep] = useState(1);
  const [avatarPreview, setAvatarPreview] = useState(null);
  const [avatarBase64, setAvatarBase64] = useState(null);
  const [savingAvatar, setSavingAvatar] = useState(false);
  const [outfitItems, setOutfitItems] = useState([]);
  const [renderedLook, setRenderedLook] = useState(null);
  const [isRendering, setIsRendering] = useState(false);
  const [renderCount, setRenderCount] = useState(0);
  const [paidLooks, setPaidLooks] = useState(0);
  const [userPlan, setUserPlan] = useState("free");
  const [showPaywall, setShowPaywall] = useState(false);
  const [showPricing, setShowPricing] = useState(false);
  const [renderStep, setRenderStep] = useState("");
  const [addingItem, setAddingItem] = useState(false);
  const [newItem, setNewItem] = useState({category:"top",placement:"Auto-detect",customPlacement:"",image:null,name:""});
  const [editingId, setEditingId] = useState(null);
  const [ftfPhoto, setFtfPhoto] = useState(null);
  const [ftfResult, setFtfResult] = useState(null);
  const [ftfLoading, setFtfLoading] = useState(false);
  const [reviews, setReviews] = useState([]);
  const [newRev, setNewRev] = useState({stars:0,text:"",name:""});
  const [revErr, setRevErr] = useState("");
  const [revSub, setRevSub] = useState(false);
  const [showAccount, setShowAccount] = useState(false);

  const avatarRef = useRef(null);
  const itemRef = useRef(null);
  const ftfRef = useRef(null);

  // Auth state
  useEffect(()=>{
    supabase.auth.getSession().then(({data:{session}})=>{
      setUser(session?.user ?? null);
      if(session?.user) loadProfile(session.user);
      else setLoading(false);
    });
    const {data:{subscription}} = supabase.auth.onAuthStateChange((_,session)=>{
      setUser(session?.user ?? null);
      if(session?.user) loadProfile(session.user);
      else { setProfile(null); setLoading(false); }
    });
    return ()=>subscription.unsubscribe();
  },[]);

  const loadProfile = async(u)=>{
    const {data} = await supabase.from('profiles').select('*').eq('id',u.id).single();
    setProfile(data);
    setLoading(false);
  };

  // Load reviews
  useEffect(()=>{
    (async()=>{try{const r=await window.storage?.get("fitted_reviews",true);if(r?.value)setReviews(JSON.parse(r.value));}catch(_){}})();
  },[]);

  const totalLooks = FREE_LIMIT + paidLooks;
  const looksLeft = userPlan==="unlimited" ? Infinity : Math.max(0, totalLooks - renderCount);
  const canRender = userPlan==="unlimited" || looksLeft>0;

  // Auth
  const handleAuth = async()=>{
    setAuthErr(""); setAuthLoading(true);
    try{
      if(authMode==="login"){
        const {error} = await supabase.auth.signInWithPassword({email:authEmail,password:authPass});
        if(error) setAuthErr(error.message);
      } else {
        const {data,error} = await supabase.auth.signUp({email:authEmail,password:authPass});
        if(error) setAuthErr(error.message);
        else if(data.user){
          await supabase.from('profiles').insert({id:data.user.id,email:authEmail});
        }
      }
    }catch(e){ setAuthErr("Something went wrong. Try again."); }
    setAuthLoading(false);
  };

  const handleSignOut = async()=>{ await supabase.auth.signOut(); setShowAccount(false); setTab("home"); };

  // Avatar
  const onAvatarImg = (e)=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=ev=>{
      // Compress
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const max=800;
        let w=img.width, h=img.height;
        if(w>max){h=h*(max/w);w=max;}
        if(h>max){w=w*(max/h);h=max;}
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        const compressed=canvas.toDataURL('image/jpeg',0.7);
        setAvatarPreview(compressed);
        setAvatarBase64(compressed);
      };
      img.src=ev.target.result;
    };
    rd.readAsDataURL(f);
  };

  const saveAvatar = async()=>{
    if(!avatarBase64||!user) return;
    setSavingAvatar(true);
    await supabase.from('profiles').upsert({id:user.id,email:user.email,avatar_base64:avatarBase64});
    await loadProfile(user);
    setSavingAvatar(false);
  };

  // Outfit items
  const onItemImg = (e)=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const max=600; let w=img.width,h=img.height;
        if(w>max){h=h*(max/w);w=max;}
        if(h>max){w=w*(max/h);h=max;}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        const compressed=canvas.toDataURL('image/jpeg',0.7);
        setNewItem(p=>({...p,image:compressed,name:f.name.replace(/\.[^/.]+$/,"")}));
      };
      img.src=ev.target.result;
    };
    rd.readAsDataURL(f);
  };

  const onFtf = (e)=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=ev=>{setFtfPhoto(ev.target.result);setFtfResult(null);};
    rd.readAsDataURL(f);
  };

  const saveItem=()=>{
    if(!newItem.image) return;
    const placement=newItem.customPlacement||newItem.placement;
    const item={...newItem,placement,id:editingId||Date.now()};
    if(editingId){setOutfitItems(p=>p.map(i=>i.id===editingId?item:i));setEditingId(null);}
    else setOutfitItems(p=>[...p,item]);
    setNewItem({category:"top",placement:"Auto-detect",customPlacement:"",image:null,name:""});
    setAddingItem(false); setRenderedLook(null);
  };
  const editItem=item=>{setNewItem({...item});setEditingId(item.id);setAddingItem(true);};
  const removeItem=id=>{setOutfitItems(p=>p.filter(i=>i.id!==id));setRenderedLook(null);};

  const handleGetFitted=()=>{
    if(!profile?.avatar_base64){alert("Please set up your avatar photo first!");setTab("try");return;}
    if(!canRender){setShowPaywall(true);return;}
    generateLook();
  };

  const generateLook=async()=>{
    if(!profile?.avatar_base64||outfitItems.length===0) return;
    setIsRendering(true); setRenderedLook(null); setTab("result");
    try{
      let cur=profile.avatar_base64;
      const catMap={top:"upper_body",bottom:"lower_body",dress:"upper_body",outerwear:"upper_body",shoes:"lower_body",accessory:"auto",headwear:"auto",swimwear:"upper_body"};
      for(let i=0;i<outfitItems.length;i++){
        const item=outfitItems[i];
        setRenderStep(`Fitting ${item.name||item.category}... (${i+1} of ${outfitItems.length})`);
        const res=await fetch('/api/tryon',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({modelImage:cur,garmentImage:item.image,category:catMap[item.category]||"auto"}),
        });
        if(!res.ok) throw new Error(`Server error ${res.status}`);
        const data=await res.json();
        if(data.error) throw new Error(data.error);
        cur=data.result;
      }
      setRenderedLook(cur); setRenderCount(c=>c+1); setRenderStep("");
    }catch(err){
      alert("Render failed: "+err.message); setRenderStep(""); setTab("try");
    }
    setIsRendering(false);
  };

  const findThisFit=async()=>{
    if(!ftfPhoto) return;
    setFtfLoading(true); setFtfResult(null);
    try{
      const res=await fetch('/api/findfit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:ftfPhoto})});
      const data=await res.json();
      setFtfResult(data);
    }catch(e){setFtfResult({error:true});}
    setFtfLoading(false);
  };

  const submitReview=async()=>{
    if(!newRev.stars){setRevErr("Please select a star rating");return;}
    if(!newRev.text.trim()){setRevErr("Please write a review");return;}
    if(!newRev.name.trim()){setRevErr("Please enter your name");return;}
    setRevSub(true); setRevErr("");
    const rev={...newRev,id:Date.now(),date:new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})};
    const updated=[rev,...reviews];
    try{await window.storage?.set("fitted_reviews",JSON.stringify(updated),true);setReviews(updated);setNewRev({stars:0,text:"",name:""});}
    catch(e){setRevErr("Failed to save.");}
    setRevSub(false);
  };

  const buy=looks=>{setPaidLooks(p=>p+looks);setShowPaywall(false);setShowPricing(false);};
  const subscribe=()=>{setUserPlan("unlimited");setShowPaywall(false);setShowPricing(false);};

  if(loading) return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#050208"}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontFamily:"'Playfair Display',serif",fontSize:"1.6rem",background:"linear-gradient(135deg,#f0eaff,#b0a8c0)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",letterSpacing:"6px",marginBottom:"20px"}}>FITTed</div>
        <div className="spin" style={{margin:"0 auto"}}/>
      </div>
    </div>
  );

  // NOT LOGGED IN
  if(!user) return(
    <>
      <style>{css}</style>
      <div className="app">
        <header className="hdr">
          <div className="logo"><span className="logo-m">FITT</span><span className="logo-a">ed</span></div>
        </header>
        <div className="auth-wrap">
          <div className="auth-box">
            <div className="auth-t">{authMode==="login"?"Welcome <em>back.</em>":"Join <em>FITTED.</em>"}</div>
            <div className="auth-s">{authMode==="login"?"Sign in to access your saved avatar and looks.":"Create your account and set up your avatar."}</div>
            <input className="auth-inp" type="email" placeholder="Email address" value={authEmail} onChange={e=>setAuthEmail(e.target.value)}/>
            <input className="auth-inp" type="password" placeholder="Password" value={authPass} onChange={e=>setAuthPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleAuth()}/>
            {authErr&&<div className="auth-err">{authErr}</div>}
            <button className="btn-p" onClick={handleAuth} disabled={authLoading}>
              {authLoading?"...":(authMode==="login"?"Sign In ✦":"Create Account ✦")}
            </button>
            <div className="auth-switch">
              {authMode==="login"?"Don't have an account? ":"Already have an account? "}
              <button onClick={()=>{setAuthMode(authMode==="login"?"signup":"login");setAuthErr("");}}>
                {authMode==="login"?"Sign up":"Sign in"}
              </button>
            </div>
          </div>
        </div>
      </div>
    </>
  );

  // AVATAR SETUP — no avatar yet
  if(!profile?.avatar_base64) return(
    <>
      <style>{css}</style>
      <div className="app">
        <header className="hdr">
          <div className="logo"><span className="logo-m">FITT</span><span className="logo-a">ed</span></div>
          <button className="btn-g" style={{width:"auto",padding:"8px 16px",fontSize:"0.58rem"}} onClick={handleSignOut}>Sign Out</button>
        </header>

        <div className="setup-wrap">
          {setupStep===1&&(<>
            <div>
              <div className="setup-step">Step 1 of 2</div>
              <div className="sec-t" style={{marginTop:6}}>Your <em>Avatar</em></div>
              <div style={{fontSize:"0.7rem",color:"#5a5070",lineHeight:1.8,marginTop:8}}>
                Upload your photo once and it's saved forever. Every try-on uses this photo automatically — you never need to upload yourself again.
              </div>
            </div>

            <div style={{fontSize:"0.6rem",letterSpacing:"3px",color:"rgba(200,192,216,0.4)",textTransform:"uppercase"}}>✦ Photo Guidelines</div>

            <div className="guide-grid">
              <div className="guide-card good">
                <div className="guide-head">✦ Do this</div>
                {PHOTO_GOOD.map((t,i)=><div key={i} className="guide-item"><span className="guide-ic">✦</span><span>{t}</span></div>)}
              </div>
              <div className="guide-card bad">
                <div className="guide-head">✕ Avoid this</div>
                {PHOTO_BAD.map((t,i)=><div key={i} className="guide-item"><span className="guide-ic">✕</span><span>{t}</span></div>)}
              </div>
            </div>

            <div className="example-row">
              <div className="example-box good-ex">
                <div className="ex-icon">🧍</div>
                <div className="ex-label">✦ Perfect</div>
                <div className="ex-tips">Full body, fitted top & leggings, plain wall</div>
              </div>
              <div className="example-box bad-ex">
                <div className="ex-icon">🧥</div>
                <div className="ex-label">✕ Avoid</div>
                <div className="ex-tips">Baggy clothes, busy background, cropped</div>
              </div>
            </div>

            <div style={{background:"rgba(122,21,37,0.06)",border:"1px solid rgba(158,30,48,0.15)",borderRadius:14,padding:"16px 18px",fontSize:"0.72rem",color:"#7a7090",lineHeight:1.8}}>
              <strong style={{color:"#aaa0b8"}}>No nudity needed.</strong> Wear a fitted outfit — leggings and a crop top, a bodycon dress, anything that shows your shape. The AI removes what you're wearing and replaces it.
            </div>

            <button className="btn-p" onClick={()=>setSetupStep(2)}>Continue ✦</button>
          </>)}

          {setupStep===2&&(<>
            <div>
              <div className="setup-step">Step 2 of 2</div>
              <div className="sec-t" style={{marginTop:6}}>Upload Your <em>Photo</em></div>
              <div style={{fontSize:"0.7rem",color:"#5a5070",lineHeight:1.8,marginTop:8}}>
                This becomes your permanent avatar. Full body, fitted clothes, plain background.
              </div>
            </div>

            <div className="avatar-upload" onClick={()=>avatarRef.current?.click()}>
              {avatarPreview&&<img src={avatarPreview} alt="Your avatar"/>}
              <div className="avatar-upload-ov">
                <div className="up-plus">＋</div>
                <div className="up-hint">Change Photo</div>
              </div>
              {!avatarPreview&&(<>
                <div className="up-plus">＋</div>
                <div className="up-hint">Tap to upload your photo</div>
                <div style={{fontSize:"0.56rem",color:"#2e2a3a",letterSpacing:"1px",textAlign:"center",padding:"0 20px"}}>Full body · Fitted outfit · Plain background</div>
              </>)}
            </div>
            <input ref={avatarRef} type="file" accept="image/*" style={{display:"none"}} onChange={onAvatarImg}/>

            {avatarPreview&&(
              <button className="btn-p" onClick={saveAvatar} disabled={savingAvatar}>
                {savingAvatar?"Saving...":"Save My Avatar ✦"}
              </button>
            )}
            <button className="btn-g" onClick={()=>setSetupStep(1)}>← Back to Guidelines</button>
          </>)}
        </div>
      </div>
    </>
  );

  // MAIN APP
  return(
    <>
      <style>{css}</style>
      <div className="app">
        <header className="hdr">
          <div className="logo" onClick={()=>setTab("home")}><span className="logo-m">FITT</span><span className="logo-a">ed</span></div>
          <div className="hdr-r">
            <div className="chip" onClick={()=>setShowPricing(true)}>
              {userPlan==="unlimited"?<><em>∞</em> unlimited</>:<><em>{looksLeft}</em> looks</>}
            </div>
            {profile?.avatar_base64&&(
              <img src={profile.avatar_base64} className="avatar-chip" onClick={()=>setShowAccount(true)} alt="You"/>
            )}
          </div>
        </header>

        <nav className="tabs">
          {[{id:"home",l:"Home"},{id:"try",l:"Try On"},{id:"find",l:"Find This Fit"},{id:"reviews",l:"Reviews"}].map(t=>(
            <button key={t.id} className={`tab ${tab===t.id?"on":""}`} onClick={()=>setTab(t.id)}>{t.l}</button>
          ))}
        </nav>

        {/* HOME */}
        {tab==="home"&&(
          <div className="wrap">
            <div className="hero">
              <div className="hero-t">See it on<br/><em>you.</em></div>
              <div className="hero-s">Any outfit · Any site · Your body</div>
              <div style={{display:"flex",flexDirection:"column",gap:10,width:"100%"}}>
                <button className="btn-p" onClick={()=>setTab("try")}>Get Fitted ✦</button>
                <button className="btn-g" onClick={()=>setTab("find")}>Find This Fit 🔍</button>
                <button className="btn-g" onClick={()=>setShowPricing(true)}>View Pricing</button>
              </div>
            </div>
            <div className="chrome-line"/>
            <div className="p-row">
              <div className="p-card" onClick={()=>setTab("try")}><div><div className="p-nm">Free</div><div className="p-ds">3 looks, no card needed</div></div><div className="p-pr">£0</div></div>
              <div className="p-card" onClick={()=>setShowPricing(true)}><div><div className="p-nm">Pay Per Look</div><div className="p-ds">Buy looks as you need them</div></div><div className="p-pr">£1.49<small>/look</small></div></div>
              <div className="p-card feat" onClick={()=>setShowPricing(true)}><div><div className="p-nm">Unlimited<span className="badge">Best</span></div><div className="p-ds">Unlimited renders + priority</div></div><div className="p-pr">£9.99<small>/mo</small></div></div>
            </div>
            {reviews.length>0&&(<>
              <div className="chrome-line"/>
              <div><div className="eyebrow">✦ Community</div><div className="sec-t">What people <em>say</em></div></div>
              {reviews.slice(0,3).map(r=>(
                <div key={r.id} className="rev-card"><Stars count={r.stars}/><div className="rev-txt">"{r.text}"</div><span className="rev-auth">{r.name}</span><span className="rev-dt">{r.date}</span></div>
              ))}
              {reviews.length>3&&<button className="btn-g" onClick={()=>setTab("reviews")}>See all {reviews.length} reviews →</button>}
            </>)}
          </div>
        )}

        {/* TRY ON */}
        {tab==="try"&&(
          <>
            <div className="wrap">
              {/* Avatar preview */}
              {profile?.avatar_base64?(
                <div className="photo-frame">
                  <img src={profile.avatar_base64} alt="Your avatar"/>
                  <button className="chg-btn" onClick={()=>{setProfile(p=>({...p,avatar_base64:null}));}}>Change Avatar</button>
                </div>
              ):(
                <div className="no-avatar-box">
                  <div style={{fontSize:"2rem",opacity:0.2}}>👤</div>
                  <div style={{fontSize:"0.65rem",letterSpacing:"2px",color:"#3a3550",textTransform:"uppercase",lineHeight:2}}>No avatar set<br/>Set up your photo to start</div>
                  <button className="btn-c" style={{maxWidth:240}} onClick={()=>setProfile(p=>({...p,avatar_base64:null}))}>Set Up Avatar ✦</button>
                </div>
              )}

              <div className="chrome-line"/>
              <div style={{fontSize:"0.54rem",letterSpacing:"4px",color:"#2e2a3a",textTransform:"uppercase"}}>✦ Your Outfit — {outfitItems.length} {outfitItems.length===1?"piece":"pieces"}</div>

              {outfitItems.length===0&&!addingItem&&<div className="empty">No items yet<br/>Add your first piece below</div>}

              <div>{outfitItems.map(item=>(
                <div key={item.id} className="oi">
                  <img src={item.image} alt={item.name}/>
                  <div className="oi-info">
                    <div className="oi-cat">{CATEGORY_OPTIONS.find(c=>c.id===item.category)?.label}</div>
                    <div className="oi-nm">{item.name||"Item"}</div>
                    <div className="oi-pl">↳ {item.placement}</div>
                  </div>
                  <div className="oi-acts">
                    <button className="ico" onClick={()=>editItem(item)}>✎</button>
                    <button className="ico del" onClick={()=>removeItem(item.id)}>✕</button>
                  </div>
                </div>
              ))}</div>

              {addingItem?(
                <div className="add-panel">
                  <div className="ph">
                    <div className="ph-t">{editingId?"Edit Item":"Add Item"}</div>
                    <button className="ico" onClick={()=>{setAddingItem(false);setEditingId(null);setNewItem({category:"top",placement:"Auto-detect",customPlacement:"",image:null,name:""});}}>✕</button>
                  </div>

                  {/* Garment guidelines */}
                  <div className="garment-guide">
                    <div className="garment-guide-title">✦ Clothing Image Guidelines</div>
                    <div className="garment-guide-row">
                      <div className="garment-guide-col gd">
                        <div className="garment-guide-col-title">✦ Good</div>
                        {GARMENT_GOOD.map((t,i)=><div key={i} className="garment-guide-item"><span style={{color:"#c8c0d8",flexShrink:0}}>✦</span><span>{t}</span></div>)}
                      </div>
                      <div className="garment-guide-col bd">
                        <div className="garment-guide-col-title">✕ Avoid</div>
                        {GARMENT_BAD.map((t,i)=><div key={i} className="garment-guide-item"><span style={{color:"#9e1e30",flexShrink:0,opacity:0.7}}>✕</span><span>{t}</span></div>)}
                      </div>
                    </div>
                  </div>

                  <div className="img-up" onClick={()=>itemRef.current?.click()}>
                    {newItem.image&&<img src={newItem.image} alt="item"/>}
                    <div className="img-up-ov"><div className="up-plus">＋</div><div className="up-hint">Change</div></div>
                    {!newItem.image&&(<><div className="up-plus">＋</div><div className="up-hint">Upload Clothing Image</div><div style={{fontSize:"0.55rem",color:"#2e2a3a"}}>Screenshot from any site</div></>)}
                  </div>
                  <input ref={itemRef} type="file" accept="image/*" style={{display:"none"}} onChange={onItemImg}/>

                  <div>
                    <div className="fld-l">What type of item?</div>
                    <div className="cat-grid">{CATEGORY_OPTIONS.map(c=>(
                      <button key={c.id} className={`cat-o ${newItem.category===c.id?"sel":""}`} onClick={()=>setNewItem(p=>({...p,category:c.id}))}>{c.icon} {c.label}</button>
                    ))}</div>
                  </div>

                  <div>
                    <div className="fld-l">Where does it go?</div>
                    <select className="s-sel" value={newItem.placement} onChange={e=>setNewItem(p=>({...p,placement:e.target.value}))}>
                      {PLACEMENT_OPTIONS.map(p=><option key={p} value={p}>{p}</option>)}
                    </select>
                    <input className="s-inp" placeholder='Or type exactly — e.g. "left wrist" or "right ear"' value={newItem.customPlacement} onChange={e=>setNewItem(p=>({...p,customPlacement:e.target.value}))}/>
                  </div>

                  <button className="btn-p" onClick={saveItem} disabled={!newItem.image}>{editingId?"Update Item":"Add to Outfit"} ✦</button>
                </div>
              ):(
                <button className="add-more" onClick={()=>setAddingItem(true)}>＋ {outfitItems.length>0?"Add Another Piece":"Add First Piece"}</button>
              )}
            </div>

            {!addingItem&&outfitItems.length>0&&(
              <div className="sticky">
                <button className="gen-btn" onClick={handleGetFitted} disabled={isRendering}>Get Fitted ✦</button>
                <div className="gen-sub">{outfitItems.length} piece{outfitItems.length>1?"s":""} · {userPlan==="unlimited"?"∞ unlimited":<><em>{looksLeft}</em> render{looksLeft===1?"":"s"} left</>}</div>
              </div>
            )}
          </>
        )}

        {/* RESULT */}
        {tab==="result"&&(
          <div className="wrap">
            <div className="res-frame">
              {isRendering&&<div className="rend-ov"><div className="spin"/><div className="rend-txt">{renderStep||"Getting you fitted..."}</div></div>}
              {(renderedLook||profile?.avatar_base64)&&<img src={renderedLook||profile.avatar_base64} alt="Your look"/>}
              {renderedLook&&<div className="res-badge">✦ Fitted</div>}
            </div>
            {renderedLook&&(<>
              <div className="res-acts">
                <button className="res-act" onClick={()=>{const a=document.createElement('a');a.href=renderedLook;a.download='fitted-look.jpg';a.click();}}>↓ Save</button>
                <button className="res-act">⤴ Share</button>
                <button className="res-act" onClick={()=>{setRenderedLook(null);setOutfitItems([]);setTab("try");}}>↺ Reset</button>
              </div>
              <button className="back-btn" onClick={()=>setTab("try")}>← Edit Outfit</button>
              <button className="btn-g" onClick={()=>setTab("reviews")}>Leave a Review ✦</button>
            </>)}
          </div>
        )}

        {/* FIND THIS FIT */}
        {tab==="find"&&(
          <div className="wrap">
            <div><div className="eyebrow">✦ AI Outfit Detective</div><div className="sec-t">Find <em>This Fit</em></div></div>
            <div style={{fontSize:"0.72rem",color:"#5a5070",lineHeight:1.85}}>Seen an influencer wearing something fire but they won't say where it's from? Upload the photo — AI will identify every item and tell you where to find it.</div>
            <div className="ftf-up" onClick={()=>ftfRef.current?.click()}>
              {ftfPhoto&&<img src={ftfPhoto} alt="Upload"/>}
              <div className="ftf-up-ov"><div className="up-plus">＋</div><div className="up-hint">Change Photo</div></div>
              {!ftfPhoto&&(<><div style={{fontSize:"3rem",opacity:0.12}}>🔍</div><div className="up-hint">Upload Influencer Photo</div><div style={{fontSize:"0.56rem",color:"#2e2a3a"}}>Screenshot, saved photo, anything</div></>)}
            </div>
            <input ref={ftfRef} type="file" accept="image/*" style={{display:"none"}} onChange={onFtf}/>
            {ftfPhoto&&!ftfResult&&<button className="btn-c" onClick={findThisFit} disabled={ftfLoading}>{ftfLoading?"Analysing...":"Find This Fit ✦"}</button>}
            {ftfLoading&&<div style={{textAlign:"center",padding:"20px 0"}}><div className="spin" style={{margin:"0 auto 16px"}}/><div style={{fontSize:"0.56rem",letterSpacing:"3px",color:"#3a3550",textTransform:"uppercase"}}>Analysing the outfit...</div></div>}
            {ftfResult&&!ftfResult.error&&(
              <div>
                {ftfResult.summary&&<div style={{fontSize:"0.78rem",color:"#8a8098",fontStyle:"italic",lineHeight:1.7,marginBottom:12}}>"{ftfResult.summary}"</div>}
                {ftfResult.items?.map((item,i)=>(
                  <div key={i} className="ftf-res">
                    <div className="ftf-rt">{item.type}</div>
                    <div className="ftf-rd">{item.description}</div>
                    <div className="fld-l" style={{marginBottom:8}}>Could be from:</div>
                    <div className="ftf-tags">{item.brands?.map((b,j)=><span key={j} className="ftf-tag">{b}</span>)}</div>
                    {item.searchTerms?.length>0&&(<><div className="fld-l" style={{marginTop:12,marginBottom:4}}>Search terms:</div><div style={{fontSize:"0.7rem",color:"#5a5070",lineHeight:2}}>{item.searchTerms.join(" · ")}</div></>)}
                  </div>
                ))}
                <button className="btn-g" onClick={()=>{setFtfPhoto(null);setFtfResult(null);}}>Try Another Photo</button>
              </div>
            )}
            {ftfResult?.error&&<div style={{textAlign:"center",fontSize:"0.7rem",color:"#5a5070"}}>Something went wrong. Please try again.</div>}
          </div>
        )}

        {/* REVIEWS */}
        {tab==="reviews"&&(
          <div className="wrap">
            <div><div className="eyebrow">✦ Community</div><div className="sec-t">Real <em>Reviews</em></div></div>
            <div className="rev-form">
              <div style={{fontFamily:"'Playfair Display',serif",fontSize:"1rem"}}>Leave Your Review</div>
              <div><div className="fld-l">Your Rating</div>
                <div className="star-row">{[1,2,3,4,5].map(i=><button key={i} className="star-btn" onClick={()=>setNewRev(p=>({...p,stars:i}))}><span style={{color:i<=newRev.stars?"#c9a84c":"#1e1a2a",fontSize:"1.6rem"}}>★</span></button>)}</div>
              </div>
              <div><div className="fld-l">Your Review</div><textarea className="rev-ta" rows={4} placeholder="Tell others about your experience..." value={newRev.text} onChange={e=>setNewRev(p=>({...p,text:e.target.value}))}/></div>
              <input className="s-inp" style={{marginTop:0}} placeholder="Your name" value={newRev.name} onChange={e=>setNewRev(p=>({...p,name:e.target.value}))}/>
              {revErr&&<div className="err-txt">{revErr}</div>}
              <button className="btn-p" onClick={submitReview} disabled={revSub}>{revSub?"Submitting...":"Submit Review ✦"}</button>
            </div>
            <div className="chrome-line"/>
            {reviews.length===0?<div className="no-rev">No reviews yet<br/>Be the first</div>:reviews.map(r=>(
              <div key={r.id} className="rev-card"><Stars count={r.stars}/><div className="rev-txt">"{r.text}"</div><span className="rev-auth">{r.name}</span><span className="rev-dt">{r.date}</span></div>
            ))}
          </div>
        )}

        {/* PRICING MODAL */}
        {showPricing&&(
          <div className="modal-bg" onClick={()=>setShowPricing(false)}>
            <div className="modal-box" onClick={e=>e.stopPropagation()}>
              <div className="modal-handle"/>
              <div className="modal-t">Choose Your <em>Plan</em></div>
              <div className="modal-s">Try free. Pay when you're obsessed.</div>
              <div className="tier"><div className="tier-h"><div className="tier-n">Free</div><div className="tier-p">£0</div></div><div className="tier-d">3 looks, no card needed.</div></div>
              <div className="tier"><div className="tier-h"><div className="tier-n">Pay Per Look</div><div className="tier-p">£1.49<small>/look</small></div></div><div className="tier-d">For occasional shoppers.</div>
                {PACKS.map(p=><button key={p.id} className="pack-btn" onClick={()=>buy(p.looks)}><span>{p.label}</span><span style={{color:"#c8c0d8"}}>£{p.price}</span></button>)}
              </div>
              <div className="tier feat"><div className="tier-h"><div className="tier-n">Unlimited<span className="badge">Best</span></div><div className="tier-p">£9.99<small>/mo</small></div></div><div className="tier-d">For the fashion obsessed.</div>
                <ul className="tier-perks"><li>Unlimited AI renders</li><li>Priority speed</li><li>Save & share looks</li><li>Find This Fit unlimited</li><li>Early access</li></ul>
                <button className="btn-c" style={{marginTop:14}} onClick={subscribe}>Subscribe ✦</button>
              </div>
              <button className="btn-g" style={{marginTop:8}} onClick={()=>setShowPricing(false)}>Close</button>
            </div>
          </div>
        )}

        {/* PAYWALL */}
        {showPaywall&&(
          <div className="modal-bg" onClick={()=>setShowPaywall(false)}>
            <div className="modal-box" onClick={e=>e.stopPropagation()}>
              <div className="modal-handle"/>
              <div className="modal-t">Free looks <em>used up.</em> 🖤</div>
              <div className="modal-s">Keep going — pick how to continue.</div>
              <div className="tier">{PACKS.map(p=><button key={p.id} className="pack-btn" onClick={()=>buy(p.looks)}><span>{p.label}</span><span style={{color:"#c8c0d8"}}>£{p.price}</span></button>)}</div>
              <div className="div-txt">or</div>
              <div className="tier feat"><div className="tier-h"><div className="tier-n">Go Unlimited</div><div className="tier-p">£9.99<small>/mo</small></div></div><div className="tier-d">Unlimited renders, priority speed.</div><button className="btn-c" style={{marginTop:12}} onClick={subscribe}>Unlock Unlimited ✦</button></div>
              <button className="btn-g" style={{marginTop:8}} onClick={()=>setShowPaywall(false)}>Not now</button>
            </div>
          </div>
        )}

        {/* ACCOUNT MODAL */}
        {showAccount&&(
          <div className="modal-bg" onClick={()=>setShowAccount(false)}>
            <div className="modal-box" onClick={e=>e.stopPropagation()}>
              <div className="modal-handle"/>
              {profile?.avatar_base64&&<img src={profile.avatar_base64} className="acct-avatar" alt="You"/>}
              <div className="acct-name">Your <em style={{fontStyle:"italic",color:"#c8c0d8"}}>Profile</em></div>
              <div className="acct-email">{user?.email}</div>
              <button className="btn-p" style={{marginBottom:10}} onClick={()=>{setProfile(p=>({...p,avatar_base64:null}));setShowAccount(false);}}>Update Avatar Photo ✦</button>
              <button className="btn-g" onClick={handleSignOut}>Sign Out</button>
            </div>
          </div>
        )}
      </div>
    </>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
