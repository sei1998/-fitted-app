  .tier-p{font-family:'Playfair Display',serif;font-size:1.25rem;color:#c8c0d8;}
  .tier-p small{font-size:0.58rem;color:#3a3550;}
  .tier-d{font-size:0.62rem;color:#4a4560;line-height:1.7;}
  .tier-perks{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:6px;}
  .tier-perks li{font-size:0.62rem;color:#5a5070;display:flex;align-items:center;gap:8px;}
  .tier-perks li::before{content:'✦';color:rgba(200,192,216,0.4);font-size:0.45rem;}
  .pack-btn{width:100%;padding:12px 18px;background:transparent;border:1px solid #1e1a2a;border-radius:12px;color:#4a4560;font-family:'Raleway',sans-serif;font-size:0.68rem;letter-spacing:1px;cursor:pointer;transition:all 0.2s;text-align:left;display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .pack-btn:hover{border-color:#c8c0d8;color:#f8f4ff;}
  .div-txt{text-align:center;font-size:0.52rem;letter-spacing:2px;color:#1e1a2a;text-transform:uppercase;margin:6px 0;}
  .m-inp{width:100%;background:#050208;border:1px solid #1e1a2a;border-radius:12px;color:#f8f4ff;font-family:'Raleway',sans-serif;font-size:0.75rem;padding:14px 16px;outline:none;margin-bottom:12px;}
  .m-inp:focus{border-color:#c8c0d8;}
  .err-txt{font-size:0.62rem;color:#9e1e30;letter-spacing:1px;}
`;

function Stars({count}){
  return <div className="rev-stars">{[1,2,3,4,5].map(i=><span key={i} className={`rev-st ${i<=count?"on":"off"}`}>★</span>)}</div>;
}

function App(){
  const [tab,setTab]=useState("home");
  const [userPhoto,setUserPhoto]=useState(null);
  const [outfitItems,setOutfitItems]=useState([]);
  const [renderedLook,setRenderedLook]=useState(null);
  const [isRendering,setIsRendering]=useState(false);
  const [renderCount,setRenderCount]=useState(0);
  const [paidLooks,setPaidLooks]=useState(0);
  const [userPlan,setUserPlan]=useState("free");
  const [showPaywall,setShowPaywall]=useState(false);
  const [showPricing,setShowPricing]=useState(false);
  const [apiKey,setApiKey]=useState("");
  const [showApiModal,setShowApiModal]=useState(false);
  const [renderStep,setRenderStep]=useState("");
  const [addingItem,setAddingItem]=useState(false);
  const [newItem,setNewItem]=useState({category:"top",placement:"Auto-detect",customPlacement:"",image:null,name:""});
  const [editingId,setEditingId]=useState(null);
  const [ftfPhoto,setFtfPhoto]=useState(null);
  const [ftfResult,setFtfResult]=useState(null);
  const [ftfLoading,setFtfLoading]=useState(false);
  const [reviews,setReviews]=useState([]);
  const [newRev,setNewRev]=useState({stars:0,text:"",name:""});
  const [revErr,setRevErr]=useState("");
  const [revSub,setRevSub]=useState(false);

  const photoRef=useRef(null);
  const itemRef=useRef(null);
  const ftfRef=useRef(null);

  useEffect(()=>{
    (async()=>{try{const r=await window.storage?.get("fitted_reviews",true);if(r?.value)setReviews(JSON.parse(r.value));}catch(_){}})();
  },[]);

  const totalLooks=FREE_LIMIT+paidLooks;
  const looksLeft=userPlan==="unlimited"?Infinity:Math.max(0,totalLooks-renderCount);
  const canRender=userPlan==="unlimited"||looksLeft>0;

  const onPhoto=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{setUserPhoto(ev.target.result);setTab("try");};r.readAsDataURL(f);};
  const onItem=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>setNewItem(p=>({...p,image:ev.target.result,name:f.name.replace(/\.[^/.]+$/,"")}));r.readAsDataURL(f);};
  const onFtf=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{setFtfPhoto(ev.target.result);setFtfResult(null);};r.readAsDataURL(f);};

  const saveItem=()=>{
    if(!newItem.image)return;
    const placement=newItem.customPlacement||newItem.placement;
    const item={...newItem,placement,id:editingId||Date.now()};
    if(editingId){setOutfitItems(p=>p.map(i=>i.id===editingId?item:i));setEditingId(null);}
    else setOutfitItems(p=>[...p,item]);
    setNewItem({category:"top",placement:"Auto-detect",customPlacement:"",image:null,name:""});
    setAddingItem(false);setRenderedLook(null);
  };
  const editItem=item=>{setNewItem({...item});setEditingId(item.id);setAddingItem(true);};
  const removeItem=id=>{setOutfitItems(p=>p.filter(i=>i.id!==id));setRenderedLook(null);};

  const handleGetFitted=()=>{
    if(!canRender){setShowPaywall(true);return;}
    if(!apiKey){setShowApiModal(true);return;}
    generateLook();
  };

  const generateLook=async()=>{
    if(!userPhoto||outfitItems.length===0)return;
    setIsRendering(true);setRenderedLook(null);setTab("result");
    try{
      let cur=userPhoto;
      const catMap={top:"upper_body",bottom:"lower_body",dress:"upper_body",outerwear:"upper_body",shoes:"lower_body",accessory:"auto",headwear:"auto",swimwear:"upper_body"};
      for(let i=0;i<outfitItems.length;i++){
        const item=outfitItems[i];
        setRenderStep(`Fitting ${item.name||item.category}... (${i+1} of ${outfitItems.length})`);
        const res=await fetch("/api/tryon",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({apiKey,modelImage:cur,garmentImage:item.image,category:catMap[item.category]||"auto"}),
        });
        if(!res.ok)throw new Error(`Server error ${res.status}`);
        const data=await res.json();
        if(data.error)throw new Error(data.error);
        cur=data.result;
      }
      setRenderedLook(cur);setRenderCount(c=>c+1);setRenderStep("");
    }catch(err){
      alert("Render failed: "+err.message);setRenderStep("");setTab("try");
    }
    setIsRendering(false);
  };

  const findThisFit=async()=>{
    if(!ftfPhoto)return;
    setFtfLoading(true);setFtfResult(null);
    try{
      const res=await fetch("/api/findfit",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({image:ftfPhoto}),
      });
      const data=await res.json();
      setFtfResult(data);
    }catch(e){setFtfResult({error:true});}
    setFtfLoading(false);
  };

  const submitReview=async()=>{
    if(!newRev.stars){setRevErr("Please select a star rating");return;}
    if(!newRev.text.trim()){setRevErr("Please write a review");return;}
    if(!newRev.name.trim()){setRevErr("Please enter your name");return;}
    setRevSub(true);setRevErr("");
    const rev={...newRev,id:Date.now(),date:new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})};
    const updated=[rev,...reviews];
    try{await window.storage?.set("fitted_reviews",JSON.stringify(updated),true);setReviews(updated);setNewRev({stars:0,text:"",name:""});}
    catch(e){setRevErr("Failed to save. Try again.");}
    setRevSub(false);
  };

  const buy=looks=>{setPaidLooks(p=>p+looks);setShowPaywall(false);setShowPricing(false);};
  const subscribe=()=>{setUserPlan("unlimited");setShowPaywall(false);setShowPricing(false);};

  return(
    <div className="app">
      <style>{css}</style>

      <header className="hdr">
        <div className="logo" onClick={()=>setTab("home")}>
          <span className="logo-m">FITT</span><span className="logo-a">ed</span>
        </div>
        <div className="chip" onClick={()=>setShowPricing(true)}>
          {userPlan==="unlimited"?<><em>∞</em> unlimited</>:<><em>{looksLeft}</em> looks left</>}
        </div>
      </header>

      <nav className="tabs">
        {[{id:"home",l:"Home"},{id:"guide",l:"Photo Guide"},{id:"try",l:"Try On"},{id:"find",l:"Find This Fit"},{id:"reviews",l:"Reviews"}].map(t=>(
          <button key={t.id} className={`tab ${tab===t.id?"on":""}`} onClick={()=>setTab(t.id)}>{t.l}</button>
        ))}
      </nav>

      {/* HOME */}
      {tab==="home"&&(
        <div className="wrap">
          <div className="hero">
            <div className="hero-t">See it on<br/><em>you.</em></div>
            <div className="hero-s">Any outfit · Any site · Your body</div>
            <div className="btn-w">
              <button className="btn-p" onClick={()=>photoRef.current?.click()}>Get Fitted ✦</button>
              <button className="btn-g" onClick={()=>setTab("find")}>Find This Fit 🔍</button>
              <button className="btn-g" onClick={()=>setShowPricing(true)}>View Pricing</button>
            </div>
            <input ref={photoRef} type="file" accept="image/*" style={{display:"none"}} onChange={onPhoto}/>
          </div>
          <div className="chrome-line"/>
          <div className="p-row">
            <div className="gc p-card" onClick={()=>setTab("guide")}><div><div className="p-nm">Free</div><div className="p-ds">3 looks, no card needed</div></div><div className="p-pr">£0</div></div>
            <div className="gc p-card" onClick={()=>setShowPricing(true)}><div><div className="p-nm">Pay Per Look</div><div className="p-ds">Buy looks as you need them</div></div><div className="p-pr">£1.49<small>/look</small></div></div>
            <div className="gc p-card feat" onClick={()=>setShowPricing(true)}><div><div className="p-nm">Unlimited<span className="badge">Best</span></div><div className="p-ds">Unlimited renders + priority</div></div><div className="p-pr">£9.99<small>/mo</small></div></div>
          </div>
          {reviews.length>0&&(<>
            <div className="chrome-line"/>
            <div><div className="eyebrow">✦ Community</div><div className="sec-t">What people <em>say</em></div></div>
            {reviews.slice(0,3).map(r=>(
              <div key={r.id} className="rev-card"><Stars count={r.stars}/><div className="rev-txt">"{r.text}"</div><span className="rev-auth">{r.name}</span><span className="rev-dt">{r.date}</span></div>
            ))}
            {reviews.length>3&&<button className="btn-g" onClick={()=>setTab("reviews")}>See all {reviews.length} reviews →</button>}
          </>)}
        </div>
      )}

      {/* GUIDE */}
      {tab==="guide"&&(
        <div className="wrap">
          <div><div className="eyebrow">✦ Before You Start</div><div className="sec-t">Photo <em>Guide</em></div></div>
          <div className="ai-note"><strong>No nudity needed.</strong> Upload a photo in fitted clothes — leggings, a fitted tee, anything showing your shape. The AI removes what you're wearing and replaces it with your new look.</div>
          {PHOTO_TIPS.map((t,i)=>(
            <div key={i} className={`tip-row ${t.good?"good":"bad"}`}>
              <span className="tip-ic">{t.good?"✦":"✕"}</span>
              <span className="tip-tx">{t.text}</span>
            </div>
          ))}
          <button className="btn-p" onClick={()=>photoRef.current?.click()}>Upload My Photo ✦</button>
          <button className="btn-g" onClick={()=>setTab("home")}>← Back</button>
          <input ref={photoRef} type="file" accept="image/*" style={{display:"none"}} onChange={onPhoto}/>
        </div>
      )}

      {/* TRY ON */}
      {tab==="try"&&(
        <>
          <div className="wrap">
            {userPhoto?(
              <div className="photo-frame">
                <img src={userPhoto} alt="You"/>
                <button className="chg-btn" onClick={()=>photoRef.current?.click()}>Change Photo</button>
                <input ref={photoRef} type="file" accept="image/*" style={{display:"none"}} onChange={onPhoto}/>
              </div>
            ):(
              <div style={{textAlign:"center",padding:"40px 0",display:"flex",flexDirection:"column",gap:14,alignItems:"center"}}>
                <div style={{fontSize:"0.62rem",letterSpacing:"3px",color:"#2e2a3a",textTransform:"uppercase"}}>No photo yet</div>
                <button className="btn-p" style={{maxWidth:280}} onClick={()=>photoRef.current?.click()}>Upload Your Photo</button>
                <input ref={photoRef} type="file" accept="image/*" style={{display:"none"}} onChange={onPhoto}/>
              </div>
            )}
            <div className="chrome-line"/>
            <div style={{fontSize:"0.54rem",letterSpacing:"4px",color:"#2e2a3a",textTransform:"uppercase"}}>✦ Your Outfit — {outfitItems.length} {outfitItems.length===1?"piece":"pieces"}</div>
            {outfitItems.length===0&&!addingItem&&<div className="empty">No items yet<br/>Add your first piece below</div>}
            <div>{outfitItems.map(item=>(
              <div key={item.id} className="oi">
                <img src={item.image} alt={item.name}/>
                <div className="oi-info">
                  <div className="oi-cat">{CATEGORY_OPTIONS.find(c=>c.id===item.category)?.label}</div>
                  <div className="oi-nm">{item.name||"Item"}</div>
                  <div className="oi-pl">↳ {item.placement}</div>
                </div>
                <div className="oi-acts">
                  <button className="ico" onClick={()=>editItem(item)}>✎</button>
                  <button className="ico del" onClick={()=>removeItem(item.id)}>✕</button>
                </div>
              </div>
            ))}</div>
            {addingItem?(
              <div className="add-panel">
                <div className="ph"><div className="ph-t">{editingId?"Edit Item":"Add Item"}</div><button className="ico" onClick={()=>{setAddingItem(false);setEditingId(null);setNewItem({category:"top",placement:"Auto-detect",customPlacement:"",image:null,name:""});}}>✕</button></div>
                <div className="img-up" onClick={()=>itemRef.current?.click()}>
                  {newItem.image&&<img src={newItem.image} alt="item"/>}
                  <div className="img-up-ov"><div className="up-plus">＋</div><div className="up-hint">Change</div></div>
                  {!newItem.image&&<><div className="up-plus">＋</div><div className="up-hint">Upload Clothing Image</div><div style={{fontSize:"0.55rem",color:"#2e2a3a"}}>Screenshot from any site</div></>}
                </div>
                <input ref={itemRef} type="file" accept="image/*" style={{display:"none"}} onChange={onItem}/>
                <div><div className="fld-l">What type of item?</div>
                  <div className="cat-grid">{CATEGORY_OPTIONS.map(c=>(
                    <button key={c.id} className={`cat-o ${newItem.category===c.id?"sel":""}`} onClick={()=>setNewItem(p=>({...p,category:c.id}))}>{c.icon} {c.label}</button>
                  ))}</div>
                </div>
                <div><div className="fld-l">Where does it go?</div>
                  <select className="s-sel" value={newItem.placement} onChange={e=>setNewItem(p=>({...p,placement:e.target.value}))}>
                    {PLACEMENT_OPTIONS.map(p=><option key={p} value={p}>{p}</option>)}
                  </select>
                  <input className="s-inp" placeholder='Or type e.g. "left wrist" or "right ear"' value={newItem.customPlacement} onChange={e=>setNewItem(p=>({...p,customPlacement:e.target.value}))}/>
                </div>
                <button className="btn-p" onClick={saveItem} disabled={!newItem.image}>{editingId?"Update Item":"Add to Outfit"} ✦</button>
              </div>
            ):(
              <button className="add-more" onClick={()=>setAddingItem(true)}>＋ {outfitItems.length>0?"Add Another Piece":"Add First Piece"}</button>
            )}
          </div>
          {!addingItem&&outfitItems.length>0&&(
            <div className="sticky">
              <button className="gen-btn" onClick={handleGetFitted} disabled={isRendering||!userPhoto}>Get Fitted ✦</button>
              <div className="gen-sub">{outfitItems.length} piece{outfitItems.length>1?"s":""} · {userPlan==="unlimited"?"∞ unlimited":<><em>{looksLeft}</em> render{looksLeft===1?"":"s"} left</>}</div>
            </div>
          )}
        </>
      )}

      {/* RESULT */}
      {tab==="result"&&(
        <div className="wrap">
          <div className="res-frame">
            {isRendering&&<div className="rend-ov"><div className="spin"/><div className="rend-txt">{renderStep||"Getting you fitted..."}</div></div>}
            {(renderedLook||userPhoto)&&<img src={renderedLook||userPhoto} alt="Your look"/>}
            {renderedLook&&<div className="res-badge">✦ Fitted</div>}
          </div>
          {renderedLook&&(<>
            <div className="res-acts">
              <button className="res-act" onClick={()=>{const a=document.createElement('a');a.href=renderedLook;a.download='fitted-look.jpg';a.click();}}>↓ Save</button>
              <button className="res-act">⤴ Share</button>
              <button className="res-act" onClick={()=>{setRenderedLook(null);setOutfitItems([]);setTab("try");}}>↺ Reset</button>
            </div>
            <button className="back-btn" onClick={()=>setTab("try")}>← Edit Outfit</button>
            <button className="btn-g" onClick={()=>setTab("reviews")}>Leave a Review ✦</button>
          </>)}
        </div>
      )}

      {/* FIND THIS FIT */}
      {tab==="find"&&(
        <div className="wrap">
          <div><div className="eyebrow">✦ AI Outfit Detective</div><div className="sec-t">Find <em>This Fit</em></div></div>
          <div style={{fontSize:"0.72rem",color:"#5a5070",lineHeight:1.85}}>Seen an influencer wearing something fire but they won't say where it's from? Upload the photo and AI will identify the clothing and tell you where to find it.</div>
          <div className="ftf-up" onClick={()=>ftfRef.current?.click()}>
            {ftfPhoto&&<img src={ftfPhoto} alt="Upload"/>}
            <div className="ftf-up-ov"><div className="up-plus">＋</div><div className="up-hint">Change Photo</div></div>
            {!ftfPhoto&&<><div style={{fontSize:"3rem",opacity:0.12}}>🔍</div><div className="up-hint">Upload Influencer Photo</div><div style={{fontSize:"0.56rem",color:"#2e2a3a"}}>Screenshot, saved photo, anything</div></>}
          </div>
          <input ref={ftfRef} type="file" accept="image/*" style={{display:"none"}} onChange={onFtf}/>
          {ftfPhoto&&!ftfResult&&<button className="btn-c" onClick={findThisFit} disabled={ftfLoading}>{ftfLoading?"Analysing Outfit...":"Find This Fit ✦"}</button>}
          {ftfLoading&&<div style={{textAlign:"center",padding:"20px 0"}}><div className="spin" style={{margin:"0 auto 16px"}}/><div style={{fontSize:"0.56rem",letterSpacing:"3px",color:"#3a3550",textTransform:"uppercase"}}>Analysing the outfit...</div></div>}
          {ftfResult&&!ftfResult.error&&(
            <div>
              {ftfResult.summary&&<div style={{fontSize:"0.78rem",color:"#8a8098",fontStyle:"italic",lineHeight:1.7,marginBottom:12}}>"{ftfResult.summary}"</div>}
              {ftfResult.items?.map((item,i)=>(
                <div key={i} className="ftf-res" style={{marginBottom:10}}>
                  <div className="ftf-rt">{item.type}</div>
                  <div className="ftf-rd">{item.description}</div>
                  <div className="fld-l" style={{marginBottom:8}}>Could be from:</div>
                  <div className="ftf-tags">{item.brands?.map((b,j)=><span key={j} className="ftf-tag">{b}</span>)}</div>
                  {item.searchTerms?.length>0&&<><div className="fld-l" style={{marginTop:12,marginBottom:4}}>Search terms:</div><div style={{fontSize:"0.7rem",color:"#5a5070",lineHeight:2}}>{item.searchTerms.join(" · ")}</div></>}
                </div>
              ))}
              <button className="btn-g" onClick={()=>{setFtfPhoto(null);setFtfResult(null);}}>Try Another Photo</button>
            </div>
          )}
          {ftfResult?.error&&<div style={{textAlign:"center",fontSize:"0.7rem",color:"#5a5070"}}>Something went wrong. Please try again.</div>}
        </div>
      )}

      {/* REVIEWS */}
      {tab==="reviews"&&(
        <div className="wrap">
          <div><div className="eyebrow">✦ Community</div><div className="sec-t">Real <em>Reviews</em></div></div>
          <div className="rev-form">
            <div style={{fontFamily:"'Playfair Display',serif",fontSize:"1rem"}}>Leave Your Review</div>
            <div><div className="fld-l">Your Rating</div>
              <div className="star-row">{[1,2,3,4,5].map(i=><button key={i} className="star-btn" onClick={()=>setNewRev(p=>({...p,stars:i}))}><span style={{color:i<=newRev.stars?"#c9a84c":"#1e1a2a",fontSize:"1.6rem"}}>★</span></button>)}</div>
            </div>
            <div><div className="fld-l">Your Review</div><textarea className="rev-ta" rows={4} placeholder="Tell others about your experience..." value={newRev.text} onChange={e=>setNewRev(p=>({...p,text:e.target.value}))}/></div>
            <input className="s-inp" style={{marginTop:0}} placeholder="Your name" value={newRev.name} onChange={e=>setNewRev(p=>({...p,name:e.target.value}))}/>
            {revErr&&<div className="err-txt">{revErr}</div>}
            <button className="btn-p" onClick={submitReview} disabled={revSub}>{revSub?"Submitting...":"Submit Review ✦"}</button>
          </div>
          <div className="chrome-line"/>
          {reviews.length===0?<div className="no-rev">No reviews yet<br/>Be the first to share your experience</div>:reviews.map(r=>(
            <div key={r.id} className="rev-card"><Stars count={r.stars}/><div className="rev-txt">"{r.text}"</div><span className="rev-auth">{r.name}</span><span className="rev-dt">{r.date}</span></div>
          ))}
        </div>
      )}

      {/* PRICING MODAL */}
      {showPricing&&(
        <div className="modal-bg" onClick={()=>setShowPricing(false)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="modal-handle"/>
            <div className="modal-t">Choose Your <em>Plan</em></div>
            <div className="modal-s">Try free. Pay when you're obsessed.</div>
            <div className="tier"><div className="tier-h"><div className="tier-n">Free</div><div className="tier-p">£0</div></div><div className="tier-d">3 looks, no card needed.</div></div>
            <div className="tier"><div className="tier-h"><div className="tier-n">Pay Per Look</div><div className="tier-p">£1.49<small>/look</small></div></div><div className="tier-d">For occasional shoppers.</div>
              {PACKS.map(p=><button key={p.id} className="pack-btn" onClick={()=>buy(p.looks)}><span>{p.label}</span><span style={{color:"#c8c0d8"}}>£{p.price}</span></button>)}
            </div>
            <div className="tier feat"><div className="tier-h"><div className="tier-n">Unlimited<span className="badge">Best</span></div><div className="tier-p">£9.99<small>/mo</small></div></div><div className="tier-d">For the fashion obsessed.</div>
              <ul className="tier-perks"><li>Unlimited AI renders</li><li>Priority speed</li><li>Save & share looks</li><li>Find This Fit unlimited</li><li>Early access to features</li></ul>
              <button className="btn-c" style={{marginTop:14}} onClick={subscribe}>Subscribe ✦</button>
            </div>
            <button className="btn-g" style={{marginTop:8}} onClick={()=>setShowPricing(false)}>Close</button>
          </div>
        </div>
      )}

      {/* PAYWALL */}
      {showPaywall&&(
        <div className="modal-bg" onClick={()=>setShowPaywall(false)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="modal-handle"/>
            <div className="modal-t">Free looks <em>used up.</em> 🖤</div>
            <div className="modal-s">Keep going — pick how to continue.</div>
            <div className="tier">{PACKS.map(p=><button key={p.id} className="pack-btn" onClick={()=>buy(p.looks)}><span>{p.label}</span><span style={{color:"#c8c0d8"}}>£{p.price}</span></button>)}</div>
            <div className="div-txt">or</div>
            <div className="tier feat"><div className="tier-h"><div className="tier-n">Go Unlimited</div><div className="tier-p">£9.99<small>/mo</small></div></div><div className="tier-d">Unlimited renders, priority speed.</div><button className="btn-c" style={{marginTop:12}} onClick={subscribe}>Unlock Unlimited ✦</button></div>
            <button className="btn-g" style={{marginTop:8}} onClick={()=>setShowPaywall(false)}>Not now</button>
          </div>
        </div>
      )}

      {/* API KEY MODAL */}
      {showApiModal&&(
        <div className="modal-bg">
          <div className="modal-box">
            <div className="modal-handle"/>
            <div className="modal-t">Connect <em>AI</em></div>
            <div className="modal-s">Get your free API key from <a href="https://fashn.ai" target="_blank">fashn.ai</a> — paste it below to activate AI rendering.</div>
            <input className="m-inp" type="password" placeholder="Paste your Fashn.ai API key..." value={apiKey} onChange={e=>setApiKey(e.target.value)}/>
            <button className="btn-p" style={{marginBottom:10}} onClick={()=>{if(apiKey.trim()){setShowApiModal(false);generateLook();}}}>Activate & Render ✦</button>
            <button className="btn-g" onClick={()=>setShowApiModal(false)}>Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
